spring.config.activate.on-profile=dev

server.address=0.0.0.0
server.port= 8080
# =====================================================
# SERVER (Tomcat)
# =====================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20s
server.tomcat.max-swallow-size=2MB
# Pakai "framework" jika di belakang nginx/reverse proxy
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html
server.compression.min-response-size=1024

spring.datasource.url=jdbc:postgresql://${DB_HOST:10.21.1.185}:${DB_PORT:5433}/${DB_NAME:proms}?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=proms_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.pool-name=proms-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# =====================================================
# JSON (Jackson) & WAKTU
# =====================================================
spring.jackson.time-zone=Asia/Jakarta
spring.jackson.default-property-inclusion=non_null

# =====================================================
# UPLOAD FILE
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =====================================================
# SECURITY: OAuth2 Resource Server (validasi JWT)
# =====================================================
# Isi salah satu sesuai Identity Provider
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:}
#spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:}

# Kunci khusus pengembangan lokal; production harus menyediakan APP_JWT_SECRET sendiri.
app.jwt.secret=${APP_JWT_SECRET:local-dev-only-secret-change-before-deploy-32chars}

# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

info.app.name=PROMS API
info.app.description=Backend project management PROMS
info.app.version=0.0.1-SNAPSHOT

# =====================================================
# LOGGING
# =====================================================
logging.level.root=INFO
logging.level.com.hyperdata.proms=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n  
