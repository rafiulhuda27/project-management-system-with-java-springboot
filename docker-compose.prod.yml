# PROMS - Production Docker Stack (Nginx + PHP-FPM + Reverb + Queue + Postgres + Redis)
#
# Cara Menjalankan:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  web:
    build:
      context: .
      target: web
    container_name: proms-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - proms_storage:/var/www/html/storage:ro
    depends_on:
      - app
      - reverb
    networks:
      - proms-network

  app:
    build:
      context: .
      target: app
    container_name: proms-app
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - CONTAINER_ROLE=app
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - proms_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - proms-network

  queue:
    build:
      context: .
      target: app
    container_name: proms-queue
    restart: unless-stopped
    command: ["queue"]
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - CONTAINER_ROLE=queue
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - proms_storage:/var/www/html/storage
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - proms-network

  reverb:
    build:
      context: .
      target: app
    container_name: proms-reverb
    restart: unless-stopped
    command: ["reverb"]
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    environment:
      - CONTAINER_ROLE=reverb
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - proms-network

  postgres:
    image: postgres:16
    container_name: proms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-proms}
      POSTGRES_USER: ${DB_MIGRATION_USERNAME:-proms_owner}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-owner_secret}
    volumes:
      - proms_pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    networks:
      - proms-network

  redis:
    image: redis:7-alpine
    container_name: proms-redis
    restart: unless-stopped
    volumes:
      - proms_redisdata:/data
    networks:
      - proms-network

networks:
  proms-network:
    driver: bridge

volumes:
  proms_pgdata:
    driver: local
  proms_redisdata:
    driver: local
  proms_storage:
    driver: local
